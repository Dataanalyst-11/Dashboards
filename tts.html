<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salesperson Performance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .reader-card { background: #ffffff; padding: 40px; border-radius: 20px; text-align: center; max-width: 90%; }
  .reader-title { font-size: 42px; font-weight: 800; color: #0f172a; margin-bottom: 30px; letter-spacing: -1px; }
  .audio-wave-container { display: flex; justify-content: center; align-items: center; gap: 10px; height: 80px; margin-bottom: 30px; }
  .wave-bar { width: 10px; background: #ba9305; border-radius: 5px; animation: wave 1.2s infinite ease-in-out; }
  @keyframes wave { 0%, 100% { height: 15px; opacity: 0.5; } 50% { height: 70px; opacity: 1; } }
  .reader-timestamp { font-size: 20px; color: #334155; font-weight: 600; margin-bottom: 10px; }
  .reader-status { font-size: 14px; color: #64748b; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-bottom: 40px; }
  
  .activate-btn {
    background: transparent; color: #64748b; border: 2px solid #cbd5e1;
    padding: 12px 30px; font-size: 15px; font-weight: 700; border-radius: 12px;
    cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .activate-btn:hover { border-color: #ba9305; color: #ba9305; }
  .activate-btn.active { border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.1); cursor: default; }
  .activate-btn.active:hover { transform: none; }

  .manual-announce-btn {
    background: #ba9305; color: #ffffff; border: none; padding: 14px 36px;
    font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease; letter-spacing: 1px;
    text-transform: uppercase; box-shadow: 0 4px 15px rgba(186, 147, 5, 0.3);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .manual-announce-btn:hover { background: #d4a807; transform: translateY(-2px); }
  .manual-announce-btn:active { transform: translateY(0); }
  .manual-announce-btn.speaking { background: #334155; color: #22c55e; animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
    70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }
  .toast {
    position: fixed; bottom: 30px; right: 30px; background: #1e293b; border: 1px solid #334155;
    border-left: 4px solid #ef4444; color: #f1f5f9; padding: 16px 24px; border-radius: 12px;
    font-size: 20px; font-weight: 600; box-shadow: 0 8px 32px rgba(0,0,0,0.4); z-index: 999;
    transform: translateX(120%); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); max-width: 380px;
  }
  .toast.show { transform: translateX(0); }
  .toast.toast-warn { border-left-color: #f59e0b; }
  .toast.toast-retry { border-left-color: #38bdf8; }
</style>
</head>
<body>

<div class="reader-card">
  <div class="reader-title">Salesperson Performance</div>
  <div class="audio-wave-container">
    <div class="wave-bar" style="animation-delay: 0s;"></div>
    <div class="wave-bar" style="animation-delay: 0.2s;"></div>
    <div class="wave-bar" style="animation-delay: 0.4s;"></div>
    <div class="wave-bar" style="animation-delay: 0.6s;"></div>
    <div class="wave-bar" style="animation-delay: 0.8s;"></div>
  </div>
  <div class="reader-timestamp" id="lastUpdated">Awaiting Data...</div>
  <div class="reader-timestamp" id="lastSpoken" style="font-size: 16px; color: #64748b; margin-bottom: 20px; font-weight: 500;">Last Announcement: Never</div>
  <div class="reader-status">Automated Performance Reader</div>
  
  <button id="activateAudioBtn" class="activate-btn" onclick="enableAudio()">🔇 Activate TTS</button>
  <br>
  <button id="manualAnnounceBtn" class="manual-announce-btn" onclick="speakBranchPerformance()">
    🔊 Announce Now
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  window.API_CONFIG = {
    API_URL: "https://dashboard-proxy.mis-philmed01-dpt.workers.dev/pharma/",

  };
</script>

<script>
  const AUTO_REFRESH_MS = 600000; // 10 minutes
  const DATA_LOOKBACK_DAYS = 365;
  let isLoading = false;
  let currentAbortCtrl = null;
  let allRawData = [];
  let branchPerfData = [];
  let lastDataFetchAt = null;

  // Audio Unlock State
  let audioEnabled = false;

  // Preload TTS Voices
  let availableVoices = [];
  if ('speechSynthesis' in window) {
    availableVoices = window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => {
      availableVoices = window.speechSynthesis.getVoices();
    };
  }

  /* ── Date helpers ────────────────────────────────────────── */
  function formatDate(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  }

  function parseDateKey(value) {
    if (!value) return null;
    const s = String(value);
    const match = s.match(/^(\d{4}-\d{2}-\d{2})/);
    return match ? match[1] : null;
  }

  function getRecordDate(record) {
    return parseDateKey(record.reportingDate || record.reportDate || record.salesDate || record.date || record.createdAt || record.updatedAt);
  }

  function getToday() { return new Date(); }

  function getFetchRange() {
    const end = getToday();
    const start = new Date(end);
    start.setDate(start.getDate() - DATA_LOOKBACK_DAYS + 1);
    return { startDate: formatDate(start), endDate: formatDate(end) };
  }

  // Hardcoded to Today for TTS
  function getDateRange() {
    const todayStr = formatDate(getToday());
    return { startDate: todayStr, endDate: todayStr };
  }

  function isDateInRange(dateKey, startDate, endDate) {
    return !!dateKey && dateKey >= startDate && dateKey <= endDate;
  }

    "orgbranch-6aa000f3374af26d46f95a9a": "Bei Bora Shoppers"
  };

  const HIGH_VALUE_RETAIL_IDS = new Set(["orgbranch-6a588cbdcd53be440ed40590", "orgbranch-6908be314397ba1eb00cbd10"]);
  const RETAIL_BRANCH_IDS = new Set([
    "orgbranch-6a5891b4cd53be440e4edbcb", "orgbranch-6a58930bcd53be440e78342f", "orgbranch-6aab99c53cab8a51560407fb",
    "orgbranch-6908bd9a4397ba1eb00a1783", "orgbranch-69d903089ca75f00087a0446", "orgbranch-6aab9a513cab8a51560d379c",
    "orgbranch-6a684b171ba6be0c08f8f715", "orgbranch-6a5894cdcd53be440ec28678", "orgbranch-6aab9ac13cab8a5156147c48",
    "orgbranch-6aab9a173cab8a51560a996e", "orgbranch-6a588cbdcd53be440ed40590", "orgbranch-6908be314397ba1eb00cbd10"
  ]);
  const SEMI_WHOLESALE_BRANCH_IDS = new Set([
    "orgbranch-6a588d82cd53be440ee3078b", "orgbranch-6a589046cd53be440e2444b8", "orgbranch-6a588df2cd53be440eec1dca",
    "orgbranch-6909a662c9bd2cf7596be81d", "orgbranch-6908bd8a4397ba1eb009baf2", "orgbranch-6a588d19cd53be440eda95d1",
    "orgbranch-6a588c18cd53be440ec8a011"
  ]);
  const BEIBORA_BRANCH_IDS = new Set([
    "orgbranch-6a74b425a74cd8c01f57e287", "orgbranch-6a74b353a74cd8c01f57e046", "orgbranch-6a74b35fa74cd8c01f57e0c7",
    "orgbranch-6a74b34da74cd8c01f57e006", "orgbranch-6a74b358a74cd8c01f57e086", "orgbranch-6aa000f3374af26d46f95a9a"
  ]);
  const WHOLESALE_BRANCH_IDS = new Set(
    Object.keys(branchNames).filter(id => !RETAIL_BRANCH_IDS.has(id) && !SEMI_WHOLESALE_BRANCH_IDS.has(id))
  );

  /* ── Formatting & Helpers ──────────────────────────────────── */
  function toNumber(value) {
    if (value === null || value === undefined || value === "") return 0;
    if (typeof value === "number") return Number.isFinite(value) ? value : 0;
    const cleaned = String(value).replace(/,/g, "").replace(/%/g, "").trim();
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : 0;
  }

  function getSalesTarget(row) { return toNumber(row.dailySalesTarget ?? row.salesTarget ?? row.target ?? row.dailyTarget ?? row.targetSales); }
  function getNetSales(row) { return toNumber(row.netDailySales ?? row.netSales ?? row.dailyNetSales ?? row.branchNetSales); }
  function getBranchNameFromSalesRow(row) { return String(row.branchName || row.orgBranchName || branchNames[row.orgBranchId] || "").trim(); }
  function getBranchIdFromRow(row) { return row.orgBranchId || row.branchId || ""; }
  function getBranchIdByName(name) {
    const normalized = String(name || "").trim().toLowerCase();
    for (const [id, branchName] of Object.entries(branchNames)) {
      if (branchName.toLowerCase() === normalized) return id;
    }
    return "";
  }

  const ID_KAWANGWARE = "orgbranch-684593b176bd774c32f150c6";
  const ID_RONGAI = "orgbranch-685002137d3c6f75c8c1db4f";
  const ID_KITENGEELA = "orgbranch-68455bea76bd774c32f031cc";
  const ID_KITUI = "orgbranch-6850015d7d3c6f75c8c1d680";

  function getTargetMultiplier(dateStr, branchId) {
    const todayStr = formatDate(getToday());
    if (dateStr !== todayStr) return 1;

    const dateObj = new Date(dateStr + "T00:00:00");
    const dayOfWeek = dateObj.getDay();

    function isLastWeekdayOfMonth(date, targetDay) {
      if (date.getDay() !== targetDay) return false;
      const lastDayOfMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0);
      return date.getDate() + 7 > lastDayOfMonth.getDate();
    }

    if (dayOfWeek === 2 && isLastWeekdayOfMonth(dateObj, 2) && branchId === ID_KITUI) return 1.5;
    if (dayOfWeek === 3 && isLastWeekdayOfMonth(dateObj, 3) && branchId === ID_KAWANGWARE) return 1.5;
    if (dayOfWeek === 5 && isLastWeekdayOfMonth(dateObj, 5) && (branchId === ID_KITENGEELA || branchId === ID_RONGAI)) return 1.5;
    if (dayOfWeek === 4 && isLastWeekdayOfMonth(dateObj, 4)) {
      if (![ID_KITUI, ID_KAWANGWARE, ID_KITENGEELA, ID_RONGAI].includes(branchId)) return 1.5;
    }

    if (dayOfWeek === 1) return 0.7;
    if (dayOfWeek === 2) return (branchId === ID_KAWANGWARE || branchId === ID_RONGAI) ? 0.6 : 0.8;
    if (dayOfWeek === 3) return (branchId === ID_KAWANGWARE || branchId === ID_RONGAI) ? 0.8 : 0.6;
    if (dayOfWeek === 4) {
      if (branchId === ID_KITENGEELA || branchId === ID_KAWANGWARE || branchId === ID_RONGAI) return 0.6;
      return 0.8;
    }
    if (dayOfWeek === 5) {
      if (branchId === ID_KAWANGWARE || branchId === ID_RONGAI || branchId === ID_KITENGEELA) return 0.8;
      return 0.6;
    }
    if (dayOfWeek === 0) return 0.5;
    return 1.0;
  }

  let toastTimer = null;
  function showToast(msg, type) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast" + (type ? " toast-" + type : "");
    void t.offsetWidth;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
  }

  function abortPreviousRequests() {
    if (currentAbortCtrl) { currentAbortCtrl.abort(); currentAbortCtrl = null; }
    currentAbortCtrl = new AbortController();
    return currentAbortCtrl.signal;
  }

  async function fetchWithRetry(url, options, maxRetries = 3) {
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      try {
        const response = await fetch(url, options);
        if (response.status === 409 && attempt < maxRetries) {
          const delay = Math.pow(2, attempt) * 1000 + Math.random() * 500;
          showToast(`Rate limited — retrying in ${Math.round(delay / 1000)}s...`, "retry");
          await new Promise(resolve => setTimeout(resolve, delay));
          continue;
        }
        if (!response.ok) throw new Error("HTTP " + response.status);
        return await response.json();
      } catch (err) {
        if (err.name === "AbortError") throw err;
        if (attempt < maxRetries) {
          const delay = Math.pow(2, attempt) * 700 + Math.random() * 300;
          await new Promise(resolve => setTimeout(resolve, delay));
          continue;
        }
        throw err;
      }
    }
  }

  /* ── MERGED API REQUESTS ──────────────── */
  async function fetchSalesData(signal) {
    const { startDate, endDate } = getFetchRange();
    const pharmaUrl = `${window.API_CONFIG.API_URL}sales-person-performance?pageSize=10000&startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}`;
    const beiboraUrl = `${window.API_CONFIG.BEIBORA_API_URL}sales-person/performance-reports?pageSize=10000&startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}`;
    const [pharmaRes, beiboraRes] = await Promise.allSettled([
      fetchWithRetry(pharmaUrl, { signal, headers: { "Content-Type": "application/json" } }),
      fetchWithRetry(beiboraUrl, { signal, headers: { "Content-Type": "application/json" } })
    ]);
    let pharmaData = pharmaRes.status === 'fulfilled' ? pharmaRes.value : [];
    let beiboraData = beiboraRes.status === 'fulfilled' ? beiboraRes.value : [];
    if (!Array.isArray(pharmaData)) pharmaData = pharmaData.data || [];
    if (!Array.isArray(beiboraData)) beiboraData = beiboraData.data || [];
    return [...pharmaData, ...beiboraData];
  }

  async function fetchBranchPerformanceData(signal) {
    const { startDate, endDate } = getFetchRange();
    const pharmaUrl = `${window.API_CONFIG.API_URL}branch-sales-performance-reports?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}&pageSize=10000`;
    const beiboraUrl = `${window.API_CONFIG.BEIBORA_API_URL}branch-performance/reports?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}&pageSize=10000`;
    const [pharmaRes, beiboraRes] = await Promise.allSettled([
      fetchWithRetry(pharmaUrl, { signal, headers: { "Content-Type": "application/json" } }),
      fetchWithRetry(beiboraUrl, { signal, headers: { "Content-Type": "application/json" } })
    ]);
    let pharmaData = pharmaRes.status === 'fulfilled' ? pharmaRes.value : [];
    let beiboraData = beiboraRes.status === 'fulfilled' ? beiboraRes.value : [];
    if (!Array.isArray(pharmaData)) pharmaData = pharmaData.data || [];
    if (!Array.isArray(beiboraData)) beiboraData = beiboraData.data || [];
    return [...pharmaData, ...beiboraData];
  }

  function aggregateBranches(startDate, endDate) {
    const daily = new Map();
    function addDaily(name, date, target, netSales, branchId) {
      if (!name || !date) return;
      const key = `${name.toLowerCase().trim()}||${date}`;
      if (!daily.has(key)) daily.set(key, { name, date, target: 0, netSales: 0, rawTarget: 0 });
      const d = daily.get(key);
      let finalTarget = Number(target) || 0;
      if (SEMI_WHOLESALE_BRANCH_IDS.has(branchId)) finalTarget = 150000;
      else if (HIGH_VALUE_RETAIL_IDS.has(branchId)) finalTarget = 80000;
      else if (RETAIL_BRANCH_IDS.has(branchId)) finalTarget = 50000;
      else if (BEIBORA_BRANCH_IDS.has(branchId)) finalTarget = Number(target) || 0;
      else finalTarget = Number(target) * getTargetMultiplier(date, branchId);
      
      d.target += finalTarget;
      d.rawTarget += Number(target) || 0;
      d.netSales += Number(netSales) || 0;
    }

    for (const row of branchPerfData) {
      const date = getRecordDate(row);
      if (!isDateInRange(date, startDate, endDate) || !date) continue;
      const name = String(row.orgBranchName || row.branchName || branchNames[row.orgBranchId] || '').trim();
      if (!name) continue;
      addDaily(name, date, getSalesTarget(row), getNetSales(row), row.orgBranchId || getBranchIdByName(name));
    }

    const salesDaily = new Map();
    for (const row of allRawData) {
      const date = getRecordDate(row);
      if (!isDateInRange(date, startDate, endDate) || !date) continue;
      const name = getBranchNameFromSalesRow(row);
      if (!name) continue;
      const key = `${name.toLowerCase().trim()}||${date}`;
      const branchId = getBranchIdFromRow(row);
      if (!salesDaily.has(key)) salesDaily.set(key, { name, date, target: getSalesTarget(row), netSales: 0, branchId });
      const d = salesDaily.get(key);
      d.netSales += getNetSales(row);
      if (!d.target) d.target = getSalesTarget(row);
    }
    for (const [key, d] of salesDaily) {
      if (!daily.has(key)) addDaily(d.name, d.date, d.target, d.netSales, d.branchId);
    }

    const groups = new Map();
    for (const d of daily.values()) {
      const key = d.name.toLowerCase().trim();
      if (!groups.has(key)) groups.set(key, { name: d.name, target: 0, netSales: 0, days: 0, hasData: true, rawTarget: 0 });
      const g = groups.get(key);
      g.target += d.target;
      g.rawTarget += d.rawTarget;
      g.netSales += d.netSales;
      g.days += 1;
    }

    return [...groups.values()].map(b => ({
      ...b,
      pct: b.target > 0 ? (b.netSales / b.target) * 100 : 0,
      rawPct: b.rawTarget > 0 ? (b.netSales / b.rawTarget) * 100 : 0
    }));
  }

  async function loadAllData() {
    if (isLoading) return;
    const signal = abortPreviousRequests();
    isLoading = true;

    try {
      const [salesData, branchData] = await Promise.all([fetchSalesData(signal), fetchBranchPerformanceData(signal)]);
      if (signal.aborted) return;
      allRawData = salesData;
      branchPerfData = branchData;
      lastDataFetchAt = new Date();
      renderBranchView();
      
      const tsEl = document.getElementById("lastUpdated");
      if (tsEl) tsEl.textContent = "Last Updated: " + lastDataFetchAt.toLocaleTimeString();

    } catch (err) {
      if (err.name === "AbortError") return;
      console.error(err);
      showToast("Failed to load data: " + err.message, "warn");
    } finally {
      if (!signal.aborted) isLoading = false;
    }
  }

  function renderBranchView() {
    if (!branchPerfData.length) return;
    const { startDate, endDate } = getDateRange();
    const aggregated = aggregateBranches(startDate, endDate);
    const byName = new Map(aggregated.map(b => [b.name.toLowerCase().trim(), b]));

    const branches = [];
    for (const id in branchNames) {
      if (!WHOLESALE_BRANCH_IDS.has(id)) continue; // Only fetch wholesale for TTS
      const name = branchNames[id];
      const entry = byName.get(name.toLowerCase().trim());
      if (entry) {
        branches.push({ name, target: entry.target, rawTarget: entry.rawTarget, netSales: entry.netSales, pct: entry.pct, rawPct: entry.rawPct, hasData: true });
      } else {
        branches.push({ name, target: 0, rawTarget: 0, netSales: 0, pct: 0, rawPct: 0, hasData: false });
      }
    }

    branches.sort((a, b) => {
      if (a.hasData && !b.hasData) return -1;
      if (!a.hasData && b.hasData) return 1;
      if (!a.hasData && !b.hasData) return a.name.localeCompare(b.name);
      return b.pct - a.pct;
    });

    window.currentRenderedBranches = branches;
  }

  /* ── Audio Unlock Logic ──────────────────────────────────── */
  function enableAudio() {
    if (audioEnabled) return;
    audioEnabled = true;
    
    const btn = document.getElementById("activateAudioBtn");
    if (btn) {
      btn.innerHTML = "🔊 TTS Active";
      btn.classList.add("active");
    }
    
    // Unlock speech synthesis and confirm to the user
    if ('speechSynthesis' in window) {
      const unlockUtt = new SpeechSynthesisUtterance("Audio activated.");
      unlockUtt.volume = 1;
      window.speechSynthesis.speak(unlockUtt);
    }
    
    // Unlock AudioContext for the bell sound
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch(e) {}
    
    console.log("Audio unlocked. Automated scheduler is now active.");
  }

  function formatPctForSpeech(pct) {
    const num = Number(pct) || 0;
    const parts = num.toFixed(1).split('.');
    const intPart = parts[0];
    const decPart = parts[1];
    const intWord = intPart === '0' ? 'zero' : intPart;
    const decWord = decPart === '0' ? 'zero' : decPart;
    return `${intWord} point ${decWord}`;
  }

  function speakCurrency(num) {
    const n = Number(num) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(2) + " million shillings";
    if (n >= 1000) return (n / 1000).toFixed(1) + " thousand shillings";
    if (n === 0) return "zero shillings";
    return Math.round(n) + " shillings";
  }

  function playBell() {
    return new Promise(resolve => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playBellStrike = (startTime, baseFreq, volume = 0.5) => {
          const partials = [
            { ratio: 1.0,  gain: 1.00, duration: 1.6 },
            { ratio: 2.0,  gain: 0.45, duration: 1.3 },
            { ratio: 2.4,  gain: 0.30, duration: 1.1 },
            { ratio: 3.0,  gain: 0.20, duration: 0.9 },
            { ratio: 4.5,  gain: 0.12, duration: 0.7 },
            { ratio: 5.4,  gain: 0.06, duration: 0.5 }
          ];
          partials.forEach(p => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = baseFreq * p.ratio;
            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.exponentialRampToValueAtTime(volume * p.gain, startTime + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + p.duration);
            osc.start(startTime);
            osc.stop(startTime + p.duration);
          });
        };
        const now = ctx.currentTime;
        playBellStrike(now, 329.63, 0.55);
        playBellStrike(now + 0.45, 329.63, 0.45);
        setTimeout(resolve, 1900);
      } catch (e) { resolve(); }
    });
  }

  function pickDeepFemaleVoice() {
    if (!availableVoices.length) availableVoices = window.speechSynthesis.getVoices();
    const FEMALE_NAMES = ['female','zira','susan','hazel','catherine','linda','heather','samantha','victoria','karen','moira','tessa','fiona','serena','kate','amelie','veena','ava','anna','joanna','salli','kendra','ivy','kimberly','monica','amy','emma','google us english'];
    function isFemale(v) { const n = (v.name || '').toLowerCase(); return FEMALE_NAMES.some(t => n.includes(t)); }

    let v = availableVoices.find(vv => /google.*uk.*female/i.test(vv.name)); if (v) return v;
    v = availableVoices.find(vv => /google.*us.*female/i.test(vv.name)); if (v) return v;
    v = availableVoices.find(vv => /samantha/i.test(vv.name)); if (v) return v;
    v = availableVoices.find(vv => /karen/i.test(vv.name)); if (v) return v;
    v = availableVoices.find(vv => /catherine/i.test(vv.name)); if (v) return v;
    v = availableVoices.find(vv => /fiona/i.test(vv.name)); if (v) return v;

    const altLocales = ['en-IE','en-AU','en-IN','en-GB','en-ZA','en-NG','en-KE','en-US'];
    for (const loc of altLocales) {
      v = availableVoices.find(vv => vv.lang === loc && isFemale(vv));
      if (v) return v;
    }
    v = availableVoices.find(vv => isFemale(vv)); if (v) return v;
    return null;
  }

  let lastAnnouncedHour = null;

  // Robust scheduler using memory + localStorage to survive reloads and background tab throttling
  function checkScheduledAnnouncement() {
    try {
      const now = new Date();
      const hour = now.getHours();
      const ANNOUNCE_HOURS = [9, 11, 13, 15, 17, 19];
      
      // Reset schedule outside of business hours
      if (hour < 8 || hour > 20) {
        lastAnnouncedHour = null;
        try { localStorage.removeItem('lastAnnouncedHour'); } catch(e) {}
        return;
      }

      // Sync memory from storage if memory is lost (e.g. after a page refresh)
      if (lastAnnouncedHour === null) {
        try { lastAnnouncedHour = localStorage.getItem('lastAnnouncedHour'); } catch(e) {}
      }
      
      // If it's time to announce, and we haven't announced for this specific hour yet
      if (ANNOUNCE_HOURS.includes(hour) && String(hour) !== String(lastAnnouncedHour)) {
        
        // Only announce if audio is enabled AND data is actually loaded
        if (!audioEnabled || !branchPerfData.length || !window.currentRenderedBranches || !window.currentRenderedBranches.length) return;
        
        // IMMEDIATELY lock this hour so the 15-second interval doesn't trigger it again
        lastAnnouncedHour = String(hour);
        try { localStorage.setItem('lastAnnouncedHour', String(hour)); } catch(e) {}
        
        // Trigger speech
        setTimeout(() => speakBranchPerformance(), 1500);
      }
    } catch (e) {
      console.error("Scheduler error:", e);
    }
  }

  async function speakBranchPerformance() {
    if (!('speechSynthesis' in window)) return;
    if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); return; }

    const branches = window.currentRenderedBranches || [];
    const withData = branches.filter(b => b.hasData);
    if (!withData.length) return;

    const customAnnouncementOrder = [
      "Kawangware Wholesale", "Naivasha", "Kitengela", "Makindu",
      "Kitui Wholesale", "Wote", "Kisumu", "Head Office",
      "Voi Branch", "Kendia", "Busia", "Rongai Wholesale", "Philmed Thika",
      "Bungoma", "Githurai",
      "Bei Bora Head Office", "Bei Bora Rongai", "Bei Bora Githurai", "Bei Bora Kitengela", "Bei Bora Thika"
    ];

    let text = `Branch Sales Alert. `;
    let announcedAny = false;

    for (const branchName of customAnnouncementOrder) {
      const b = withData.find(x => x.name === branchName);
      if (b) {
        announcedAny = true;
        const speakName = phoneticNames[b.name] || b.name;
        text += `${speakName}. `;
        text += `${formatPctForSpeech(b.pct)} percent. `;

        const isSpecialDay = b.rawTarget > 0 && b.target !== b.rawTarget;
        const specialDeficit = b.target - b.netSales;

        if (isSpecialDay) {
          if (specialDeficit > 0) text += `Deficit on special target: ${speakCurrency(specialDeficit)}. `;
          else if (specialDeficit < 0) text += `Surplus on special target: ${speakCurrency(Math.abs(specialDeficit))}. `;
          else text += `Deficit on special target: zero shillings. `;
        } else {
          if (specialDeficit > 0) text += `Deficit: ${speakCurrency(specialDeficit)}. `;
          else if (specialDeficit < 0) text += `Surplus: ${speakCurrency(Math.abs(specialDeficit))}. `;
          else text += `Deficit: zero shillings. `;
        }
        text += " ";
      }
    }

    if (!announcedAny) return;

    await playBell();

    const utterance = new SpeechSynthesisUtterance(text);
    if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
    
    const selectedVoice = pickDeepFemaleVoice();
    if (selectedVoice) {
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
    } else {
      utterance.lang = 'en-KE';
    }
    
    utterance.pitch = 0.85;
    utterance.rate = 0.9;
    
    const btn = document.getElementById("manualAnnounceBtn");
    if (btn) {
      utterance.onstart = () => {
        btn.classList.add("speaking");
        
        // Record the exact time TTS starts speaking
        const now = new Date();
        const timeStr = now.toLocaleTimeString();
        const today = new Date();
        const isToday = now.toDateString() === today.toDateString();
        
        const lastSpokenEl = document.getElementById("lastSpoken");
        if (lastSpokenEl) {
          lastSpokenEl.textContent = "Last Announcement: " + timeStr + (isToday ? " (Today)" : "");
        }
        
        // Save to localStorage so it survives page reloads
        try { localStorage.setItem('lastTTS', now.toISOString()); } catch(e) {}
      };
      utterance.onend = () => btn.classList.remove("speaking");
      utterance.onerror = () => btn.classList.remove("speaking");
    }

    window.speechSynthesis.speak(utterance);
  }

  // Restore last spoken time from localStorage on page load
  try {
    const lastTTS = localStorage.getItem('lastTTS');
    if (lastTTS) {
      const dateObj = new Date(lastTTS);
      const today = new Date();
      const isToday = dateObj.toDateString() === today.toDateString();
      const lastSpokenEl = document.getElementById("lastSpoken");
      if (lastSpokenEl) {
        lastSpokenEl.textContent = "Last Announcement: " + dateObj.toLocaleTimeString() + (isToday ? " (Today)" : " (" + dateObj.toLocaleDateString() + ")");
      }
    }
  } catch(e) {}

  /* ── INIT ────────────────────────────────────────────────── */
  loadAllData();

  setInterval(() => { if (!isLoading) loadAllData(); }, AUTO_REFRESH_MS);
  
  // Check every 15 seconds for schedule
  setInterval(checkScheduledAnnouncement, 15000);
  setTimeout(checkScheduledAnnouncement, 5000); // Check 5s after load
</script>
